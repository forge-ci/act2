name: services-host-network
on: push
jobs:
  services-host-network:
    runs-on: ubuntu-latest
    services:
      nginx:
        image: "nginx:1.30.6@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20"
        ports:
          - "8080:80"
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -yqq install --no-install-recommends curl net-tools
      - run: netstat -tlpen
      - run: curl -v http://localhost:8080
